<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>France Voting Intention & Media Impact Model</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    <header class="border-b border-slate-700 pb-4">
      <h1 class="text-3xl font-bold tracking-tight">France Voting Intention Predictor</h1>
      <p class="text-slate-400 text-sm mt-1">Automated daily media framing shift analysis</p>
    </header>

    <main class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
      <h2 class="text-xl font-semibold mb-4 text-slate-200">Current Voting Intentions (%)</h2>
      <div class="relative w-full h-[400px]">
        <canvas id="votingChart"></canvas>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
