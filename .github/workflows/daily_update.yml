name: Daily data update

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 06:00/07:00 à Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run pipeline (polls, RSS, Claude analysis, model)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional overrides, set as repository variables:
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT || 'low' }}
        run: python -m pipeline

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_data.json data/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Automated daily data update ($(date -u +%F))"
            git push
          fi
