name: Run Daily Media Ingestion

on:
  schedule:
    - cron: '0 6 * * *' # Runs every morning at 6:00 AM UTC
  workflow_dispatch:      # Allows manual trigger anytime from GitHub UI

jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Run media ingestion model
        run: python ingest_media.py

      - name: Commit and push updated live_data.json
        run: |
          git config --global user.name "Lucas2207"
          git config --global user.email "Lucas2207@users.noreply.github.com"
          git add live_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily media update" && git push)
